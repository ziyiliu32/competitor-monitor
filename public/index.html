<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Competitor Monitoring</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">JAPAN COMPETITOR INTELLIGENCE</p>
          <h1>Competitor Monitoring</h1>
          <p class="subhead">Red Wing · UGG · Dr. Martens · Converse · Nike</p>
        </div>
        <div class="run-box">
          <span id="status-dot" class="status-dot"></span>
          <span id="status">Loading status…</span>
          <button id="run-now" type="button">Run now</button>
        </div>
      </header>

      <section class="report-summary">
        <div>
          <p class="label">Report date</p>
          <p class="report-date" id="report-date">—</p>
        </div>
        <div>
          <p class="label">Capture schedule</p>
          <p class="report-time">Daily at 11:00 JST</p>
        </div>
        <div class="insight">
          <p class="label">Daily overview</p>
          <p id="insight">Loading…</p>
        </div>
      </section>

      <section class="toolbar">
        <div id="counts" class="counts"></div>
        <button id="reload" class="text-button" type="button">Reload</button>
      </section>

      <section id="cards" class="cards" aria-live="polite"></section>
    </main>

    <template id="card-template">
      <article class="card">
        <div class="card-topline">
          <div>
            <p class="brand"></p>
            <h2 class="type"></h2>
          </div>
          <span class="priority"></span>
        </div>
        <a class="source-link" target="_blank" rel="noreferrer">Open source page ↗</a>
        <a class="full-image-link" target="_blank" rel="noreferrer">Open screenshot ↗</a>
        <div class="image-wrap">
          <img class="screenshot" alt="" />
          <div class="empty-shot">Waiting for first screenshot</div>
        </div>
        <section class="summary">
          <p class="headline"></p>
          <p class="business-summary"></p>
          <ul class="changes"></ul>
        </section>
        <p class="captured-at"></p>
      </article>
    </template>
    <script src="/app.js"></script>
  </body>
</html>
